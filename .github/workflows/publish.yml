name: Publish to PyPI

# Fires when a version tag (e.g. v0.1.0) is pushed, or on manual dispatch.
#
# Authentication: PyPI Trusted Publishing (OIDC) — GitHub proves this
# workflow's identity to PyPI at upload time, no stored secret required.
# One-time setup before the first release: on pypi.org, add a Trusted
# Publisher for this project (or a "pending publisher" if the project
# doesn't exist yet) with Owner "regs08", Repository
# "SVCProcessingPipeline", Workflow "publish.yml", Environment "pypi".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
