name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build ".[dev,demo]"

      - name: Compile tracked Python files
        run: |
          export PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache"
          python -m py_compile $(git ls-files '*.py')

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest -q

      - name: Build wheel
        run: python -m build --wheel --outdir "${RUNNER_TEMP}/dist"

      - name: Smoke-test installed wheel and pip-first notebook
        env:
          MPLBACKEND: Agg
        run: |
          NOTEBOOK_VENV="${RUNNER_TEMP}/notebook-venv"
          SMOKE_DIR="${RUNNER_TEMP}/notebook-smoke"
          WHEEL="$(find "${RUNNER_TEMP}/dist" -maxdepth 1 -name '*.whl' -print -quit)"

          python - "${WHEEL}" <<'PY'
          from sys import argv
          from zipfile import ZipFile

          with ZipFile(argv[1]) as archive:
              names = archive.namelist()
          forbidden = [
              name for name in names
              if name.startswith(("notebooks/", "tests/", "pipeline_outputs/"))
              or name.endswith((".sig", ".csv"))
              or "demo_data" in name
          ]
          assert "pipeline/notebook.py" in names
          assert not forbidden, forbidden
          PY

          python -m venv "${NOTEBOOK_VENV}"
          "${NOTEBOOK_VENV}/bin/python" -m pip install "${WHEEL}[demo]"
          "${NOTEBOOK_VENV}/bin/python" -c \
            'import IPython, ipykernel, matplotlib, nbclient, nbconvert, nbformat; import pipeline.notebook'
          "${NOTEBOOK_VENV}/bin/python" -m ipykernel install \
            --prefix "${NOTEBOOK_VENV}" --name svc-smoke

          mkdir -p "${SMOKE_DIR}"
          python -c \
            'import sys; from tests.notebook_data import create_notebook_test_data; create_notebook_test_data(sys.argv[1])' \
            "${SMOKE_DIR}/sig-data"
          cp notebooks/pipeline_demo/pipeline_demo_notebook.ipynb \
            "${SMOKE_DIR}/pipeline_demo_notebook.ipynb"
          cd "${SMOKE_DIR}"
          SVC_DATA_FOLDER="${SMOKE_DIR}/sig-data" \
            JUPYTER_PATH="${NOTEBOOK_VENV}/share/jupyter" \
            "${NOTEBOOK_VENV}/bin/python" -m nbconvert --to notebook --execute \
              --ExecutePreprocessor.kernel_name=svc-smoke \
              --ExecutePreprocessor.timeout=600 \
              pipeline_demo_notebook.ipynb --output demo_run.ipynb

          find pipeline_outputs \
            -path "*_rename_to_keep/spectra.csv" -type f -print -quit | grep -q .
          find pipeline_outputs \
            -path "*_rename_to_keep/spectra_paired.csv" -type f -print -quit | grep -q .
