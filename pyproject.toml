[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "svc-processing"
version = "0.1.6"
description = "Pure-Python SVC HR-1024i hyperspectral .sig processing pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Cole Regnier", email = "nr466@cornell.edu" },
    { name = "Gold Lab (GrapeSPEC project), Cornell University" },
]
keywords = [
    "hyperspectral",
    "spectroscopy",
    "SVC",
    "HR-1024i",
    "remote-sensing",
    "reflectance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
]

[project.urls]
Repository = "https://github.com/regs08/SVCProcessingPipeline"

[project.optional-dependencies]
demo = [
    "ipykernel",
    "matplotlib",
    "nbclient",
    "nbconvert",
    "nbformat",
]
dev = [
    "pyflakes",
    "pytest>=8.3.0",
    "ruff",
    "vulture",
]

[project.scripts]
svc-pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline", "pipeline.*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"notebooks/pipeline_demo.ipynb" = ["E402"]
