[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svc-processing-pipeline"
version = "0.1.0"
description = "Pure-Python SVC HR-1024i hyperspectral .sig processing pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
]

[project.optional-dependencies]
demo = [
    "matplotlib",
    "nbclient",
    "nbconvert",
    "nbformat",
]
dev = [
    "pyflakes",
    "pytest>=8.3.0",
    "ruff",
    "vulture",
]

[project.scripts]
svc-pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"notebooks/pipeline_demo.ipynb" = ["E402"]
